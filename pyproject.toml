[project]
name = "food-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eduardo da Silveira", email = "eduardomsilveira3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "albumentationsx[gui]>=2.4.10",
    "datasets>=5.0.1",
    "matplotlib>=3.11.2",
    "pydantic>=2.13.5,<3",
    "torch>=2.14.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

[project.scripts]
food-classification = "food_classification.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
